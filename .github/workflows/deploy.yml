name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A real repository with history, so the build can ask git for its commit. SF-7: a build
      # outside one degrades to `unknown` and still exits 0. A CI checkout is also clean by
      # construction, which is what SF-11 wants and what a local tree cannot promise.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      # `--with-deps` is correct HERE and wrong locally, and the difference is worth the comment:
      # a CI runner has passwordless sudo, while a WSL shell has no stdin for the password prompt
      # and hangs rather than failing (setup-ai-env §3).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Without this a CI-only failure leaves nothing to look at, and the logs need admin rights to
      # read through the API. The report and traces are downloadable from the run's summary page.
      - name: Keep the evidence when the smoke tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Deploying is not the same as having deployed. SF-8: ask the artefact, not the control API.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-deployment.sh "${{ needs.deploy.outputs.page_url }}" "${{ github.sha }}"
