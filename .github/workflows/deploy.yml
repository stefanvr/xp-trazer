name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per branch, so two branches never queue behind each other. A superseded branch run is cancelled;
# a run on main is not, because cancelling one half-way through a deployment is how you get a
# published artefact nobody chose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Runs on every branch. Deploying does not, which is the whole point: the first time these tests
  # ran in CI used to be after a merge to main, so main was where CI failures were discovered.
  build:
    runs-on: ubuntu-latest
    steps:
      # A real repository with history, so the build can ask git for its commit. SF-7: a build
      # outside one degrades to `unknown` and still exits 0. A CI checkout is also clean by
      # construction, which is what SF-11 wants and what a local tree cannot promise.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      # `--with-deps` is correct HERE and wrong locally, and the difference is worth the comment:
      # a CI runner has passwordless sudo, while a WSL shell has no stdin for the password prompt
      # and hangs rather than failing (setup-ai-env §3).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Without this a CI-only failure leaves nothing to look at, and the logs need admin rights to
      # read through the API. The report and traces are downloadable from the run's summary page.
      - name: Keep the evidence when the smoke tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - run: npm run build

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Deploying is not the same as having deployed. SF-8: ask the artefact, not the control API.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-deployment.sh "${{ needs.deploy.outputs.page_url }}" "${{ github.sha }}"
